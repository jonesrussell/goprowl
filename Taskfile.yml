version: '3'

tasks:
  build:
    desc: Build the application
    cmds:
      - go build -v ./...

  test:
    desc: Run tests
    cmds:
      - go test -v -race ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  generate:
    desc: Generate mocks and other generated code
    cmds:
      - go generate ./...

  crawl:
    desc: Run the application
    cmds:
      - go run main.go crawl --url=https://www.elliotlaketoday.com/opp-beat

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -f goprowl
      - go clean

  deps:
    desc: Download dependencies
    cmds:
      - go mod download
      - go mod tidy

  all:
    desc: Run all basic checks
    deps: [lint, test, build] 